services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: freelanceos
      POSTGRES_USER: freelanceos
      POSTGRES_PASSWORD: freelanceos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freelanceos -d freelanceos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgres://freelanceos:freelanceos@db:5432/freelanceos
      STORAGE_PATH: /app/storage
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - app_storage:/app/storage
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://freelanceos:freelanceos@db:5432/freelanceos
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  app_storage:
